[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rrlbin"
version = "0.0.1"
description = "Light-travel-time binary population of LMC RR Lyrae from OGLE/MACHO photometry"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
